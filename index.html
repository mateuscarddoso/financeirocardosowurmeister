<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Financeiro</title>
    <!-- Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React e Babel para rodar no navegador sem build -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        /* Esconder setas de input number */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-[#F3F5F7] text-[#1A1D21] antialiased tracking-tight">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            Plus, Database, ArrowUp, ArrowDown, CheckCircle2, Clock, Trash2, X, 
            Calendar, ChevronLeft, ChevronRight, Search, Pencil, Settings2, 
            ListTodo, AlertCircle, ChevronDown, ChevronUp, PlusCircle, CheckSquare, 
            Square, Upload, Image: ImageIcon 
        } = lucide;

        const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

        // Componentes de Ícones Lucide para React Manual
        const Icon = ({ name, size = 18, className = "" }) => {
            const LucideIcon = lucide[name];
            return LucideIcon ? <LucideIcon size={size} className={className} /> : null;
        };

        const SummaryCard = ({ title, value, subtitle, theme }) => {
            const styles = { 
                neutral: "bg-white border-slate-200", 
                income: "bg-white border-emerald-100 border-l-[3px] border-l-emerald-500", 
                expense: "bg-white border-rose-100 border-l-[3px] border-l-rose-400" 
            };
            const textColors = { neutral: "text-slate-800", income: "text-emerald-700", expense: "text-rose-700" };
            return (
                <div className={`p-4 rounded-2xl border ${styles[theme]} shadow-sm transition-all hover:shadow-md font-medium leading-none`}>
                    <span className="text-[8px] font-medium uppercase text-slate-400 tracking-widest">{title}</span>
                    <p className={`text-sm font-medium ${textColors[theme]} mt-3 tracking-tight`}>
                        {new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value)}
                    </p>
                    <p className="text-[8px] text-slate-300 mt-1.5 font-medium uppercase">{subtitle}</p>
                </div>
            );
        };

        const App = () => {
            const [year, setYear] = useState(2026);
            const [month, setMonth] = useState(1);
            const [view, setView] = useState('mensal'); 
            const [searchTerm, setSearchTerm] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [showPendencies, setShowPendencies] = useState(false);
            const [selectedIds, setSelectedIds] = useState([]);

            const [appTitle, setAppTitle] = useState(() => localStorage.getItem('fin_title_v21') || 'Meu Controle');
            const [appLogo, setAppLogo] = useState(() => localStorage.getItem('fin_logo_v21') || null);
            const [recurrentItems, setRecurrentItems] = useState(() => JSON.parse(localStorage.getItem('fin_rec_v21') || '[]'));
            const [monthlyData, setMonthlyData] = useState(() => JSON.parse(localStorage.getItem('fin_mon_v21') || '{}'));

            useEffect(() => {
                localStorage.setItem('fin_rec_v21', JSON.stringify(recurrentItems));
                localStorage.setItem('fin_mon_v21', JSON.stringify(monthlyData));
                localStorage.setItem('fin_title_v21', appTitle);
                if (appLogo) localStorage.setItem('fin_logo_v21', appLogo);
            }, [recurrentItems, monthlyData, appTitle, appLogo]);

            const periodKey = `${year}-${month}`;

            const currentEntries = useMemo(() => {
                const specifics = monthlyData[periodKey] || [];
                const statusKey = `status-${periodKey}`;
                const paymentStatus = monthlyData[statusKey] || {};
                const combined = recurrentItems.map(r => ({
                    ...r,
                    isPaid: paymentStatus[r.id] || false,
                    isRecurrent: true,
                    date: `${year}-${String(month).padStart(2, '0')}-${String(r.dueDay || '01').padStart(2, '0')}`
                }));
                const all = [...combined, ...specifics];
                return searchTerm ? all.filter(i => i.desc.toLowerCase().includes(searchTerm.toLowerCase())) : all;
            }, [recurrentItems, monthlyData, periodKey, searchTerm, year, month]);

            const stats = useMemo(() => {
                return currentEntries.reduce((acc, t) => {
                    const val = parseFloat(t.amount) || 0;
                    if (t.type === 'ENTRADA') { acc.totalIn += val; if (t.isPaid) acc.realIn += val; }
                    else { acc.totalOut += val; if (t.isPaid) acc.realOut += val; }
                    return acc;
                }, { totalIn: 0, totalOut: 0, realIn: 0, realOut: 0 });
            }, [currentEntries]);

            const lastMonthPendencies = useMemo(() => {
                if (year === 2026 && month === 1) return [];
                const prevM = month === 1 ? 12 : month - 1;
                const prevY = month === 1 ? year - 1 : year;
                const prevKey = `${prevY}-${prevM}`;
                const prevStatus = monthlyData[`status-${prevKey}`] || {};
                const pRec = recurrentItems.filter(r => r.type === 'SAIDA' && !prevStatus[r.id]);
                const pSpec = (monthlyData[prevKey] || []).filter(i => i.type === 'SAIDA' && !i.isPaid);
                return [...pRec, ...pSpec].map(p => ({ ...p, prevY, prevM }));
            }, [monthlyData, month, year, recurrentItems]);

            const handleSave = (item) => {
                const formatted = { ...item, desc: item.desc.toUpperCase() };
                if (view === 'fixos') {
                    if (editingItem) setRecurrentItems(recurrentItems.map(r => r.id === editingItem.id ? { ...formatted, id: editingItem.id } : r));
                    else setRecurrentItems([...recurrentItems, { ...formatted, id: `r-${Date.now()}` }]);
                } else {
                    const specs = monthlyData[periodKey] || [];
                    if (editingItem) setMonthlyData({ ...monthlyData, [periodKey]: specs.map(t => t.id === editingItem.id ? { ...formatted, id: editingItem.id } : t) });
                    else setMonthlyData({ ...monthlyData, [periodKey]: [{ ...formatted, id: `s-${Date.now()}` }, ...specs] });
                }
                setShowModal(false); setEditingItem(null);
            };

            const toggleStatus = (id, isRec, tY = year, tM = month) => {
                const key = `${tY}-${tM}`;
                if (isRec) {
                    const sKey = `status-${key}`;
                    const curS = monthlyData[sKey] || {};
                    setMonthlyData({ ...monthlyData, [sKey]: { ...curS, [id]: !curS[id] } });
                } else {
                    setMonthlyData({ ...monthlyData, [key]: (monthlyData[key] || []).map(t => t.id === id ? { ...t, isPaid: !t.isPaid } : t) });
                }
            };

            const formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);

            const handleMonthChange = (offset) => {
                let newMonth = month + offset;
                let newYear = year;
                if (newMonth < 1) { newMonth = 12; newYear--; }
                if (newMonth > 12) { newMonth = 1; newYear++; }
                setMonth(newMonth);
                setYear(newYear);
            };

            const deleteItem = (id, isRec) => {
                if (isRec) setRecurrentItems(recurrentItems.filter(r => r.id !== id));
                else setMonthlyData({ ...monthlyData, [periodKey]: (monthlyData[periodKey] || []).filter(t => t.id !== id) });
            };

            const closeModal = () => {
                setShowModal(false);
                setEditingItem(null);
            };

            return (
                <div className="min-h-screen flex flex-col font-medium">
                    {/* HEADER */}
                    <header className="bg-[#111827] text-white shadow-sm sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-2 flex flex-col md:flex-row justify-between items-center gap-2">
                            <div className="flex items-center gap-3 py-1">
                                {appLogo ? <img src={appLogo} className="w-8 h-8 rounded-lg object-cover" /> : <div className="bg-blue-600 p-1.5 rounded-lg"><Icon name="Database" size={16} /></div>}
                                <div><h1 className="text-sm font-medium leading-none">{appTitle}</h1><span className="text-[7px] text-slate-500 uppercase tracking-widest mt-0.5 block">2026</span></div>
                            </div>
                            <div className="flex items-center bg-[#1F2937] p-0.5 rounded-lg border border-slate-700">
                                <button onClick={() => setView('mensal')} className={`px-4 py-1 rounded-md text-[10px] transition-all ${view === 'mensal' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Mensal</button>
                                <button onClick={() => setView('fixos')} className={`px-4 py-1 rounded-md text-[10px] transition-all ${view === 'fixos' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Fixos</button>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="flex items-center gap-1 bg-[#1F2937] rounded-lg px-2 py-1 border border-slate-700">
                                    <button onClick={() => handleMonthChange(-1)} disabled={year === 2026 && month === 1} className="p-0.5 text-slate-400 hover:text-blue-400"><Icon name="ChevronLeft" size={14}/></button>
                                    <span className="text-[9px] font-medium w-20 text-center uppercase">{MONTHS[month-1]} {year}</span>
                                    <button onClick={() => handleMonthChange(1)} className="p-0.5 text-slate-400 hover:text-blue-400"><Icon name="ChevronRight" size={14}/></button>
                                </div>
                                <button onClick={() => setShowSettings(true)} className="p-1.5 bg-[#1F2937] rounded-lg border border-slate-700"><Icon name="Settings2" size={14} className="text-slate-400" /></button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 w-full space-y-4 flex-1">
                        {view === 'mensal' ? (
                            <>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    <SummaryCard title="Previsão" value={stats.totalIn - stats.totalOut} subtitle="Balanço Final" theme="neutral" />
                                    <SummaryCard title="Entradas" value={stats.totalIn} subtitle="Mês" theme="income" />
                                    <SummaryCard title="Saídas" value={stats.totalOut} subtitle="Mês" theme="expense" />
                                    <div className="bg-[#111827] p-4 rounded-2xl shadow-md flex flex-col justify-between border border-slate-800">
                                        <span className="text-[8px] font-medium uppercase text-slate-500 tracking-wider">Saldo em Conta</span>
                                        <p className="text-base font-medium text-white tracking-tight mt-1">{formatCurrency(stats.realIn - stats.realOut)}</p>
                                        <div className="flex items-center gap-1 mt-1"><div className="w-1 h-1 rounded-full bg-blue-500 animate-pulse-slow" /><span className="text-[7px] text-blue-400 uppercase">Líquido</span></div>
                                    </div>
                                </div>

                                {lastMonthPendencies.length > 0 && (
                                    <div className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                                        <button onClick={() => setShowPendencies(!showPendencies)} className="w-full px-4 py-2.5 flex items-center justify-between text-slate-500 hover:bg-slate-50 transition-colors">
                                            <div className="flex items-center gap-2"><Icon name="AlertCircle" size={14} /><span className="text-[10px] font-medium uppercase">Contas Pendentes ({lastMonthPendencies.length})</span></div>
                                            {showPendencies ? <Icon name="ChevronUp" size={14}/> : <Icon name="ChevronDown" size={14}/>}
                                        </button>
                                        {showPendencies && (
                                            <div className="px-4 pb-3 space-y-1.5 border-t border-slate-50 pt-2 bg-slate-50/50">
                                                {lastMonthPendencies.map(p => (
                                                    <div key={p.id} className="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-100 shadow-sm">
                                                        <div className="flex items-center gap-3">
                                                            <button onClick={() => toggleStatus(p.id, p.isRecurrent, p.prevY, p.prevM)} className="text-slate-300 hover:text-blue-500"><Icon name="Clock" size={14} /></button>
                                                            <span className="text-[10px] font-medium uppercase">{p.desc}</span>
                                                        </div>
                                                        <span className="text-[10px] font-medium text-rose-500/80">{formatCurrency(p.amount)}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                                    <div className="px-4 py-3 border-b border-slate-50 flex flex-col md:flex-row justify-between items-center gap-2">
                                        <div className="flex items-center gap-3">
                                            <h2 className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Lançamentos</h2>
                                            <button onClick={() => { setEditingItem(null); setShowModal(true); }} className="bg-blue-600 text-white p-1 rounded-full hover:bg-blue-700 active:scale-95 shadow-sm"><Icon name="Plus" size={14} /></button>
                                        </div>
                                        <div className="relative w-full md:w-48">
                                            <Icon name="Search" size={10} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-300" />
                                            <input type="text" placeholder="Buscar..." className="w-full bg-[#F8FAFC] border border-slate-200 rounded-lg py-1 pl-7 pr-3 text-[9px] focus:ring-1 focus:ring-blue-500 outline-none" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                        </div>
                                    </div>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead className="bg-[#F8FAFC] text-[7px] font-bold text-slate-400 uppercase tracking-widest">
                                                <tr>
                                                    <th className="px-4 py-2 border-b w-8">...</th>
                                                    <th className="px-2 py-2 border-b">Status</th>
                                                    <th className="px-2 py-2 border-b">Descrição</th>
                                                    <th className="px-2 py-2 border-b text-right">Valor</th>
                                                    <th className="px-4 py-2 border-b text-center w-16">Ações</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50 text-[10px]">
                                                {currentEntries.length === 0 ? <tr><td colSpan="5" className="px-6 py-10 text-center text-slate-300 italic">Vazio. Adicione no "+".</td></tr> : currentEntries.map((t) => (
                                                    <tr key={t.id} className={`hover:bg-slate-50 transition-colors ${t.isPaid ? 'opacity-40' : ''}`}>
                                                        <td className="px-4 py-3 text-center"><Icon name="CheckSquare" size={14} className="text-slate-200" /></td>
                                                        <td className="px-2 py-3">
                                                            <button onClick={() => toggleStatus(t.id, t.isRecurrent)} className={`px-2 py-0.5 rounded-md text-[7px] uppercase border ${t.isPaid ? 'bg-emerald-50 border-emerald-100 text-emerald-600' : 'bg-white border-slate-200 text-slate-400'}`}>
                                                                {t.isPaid ? 'Pago' : 'Pendente'}
                                                            </button>
                                                        </td>
                                                        <td className="px-2 py-3">
                                                            <div className="flex flex-col">
                                                                <div className="flex items-center gap-1.5"><span className={t.isPaid ? 'line-through text-slate-400' : 'text-slate-700'}>{t.desc}</span>{t.isRecurrent && <span className="text-[6px] bg-blue-50 text-blue-500 px-1 rounded border border-blue-100">Fixo</span>}</div>
                                                                <span className="text-[8px] text-slate-400 uppercase">{t.category} • {t.date ? new Date(t.date).toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'}) : '--/--'}</span>
                                                            </div>
                                                        </td>
                                                        <td className="px-2 py-3 text-right font-medium">
                                                            <span className={t.type === 'ENTRADA' ? 'text-emerald-600' : 'text-rose-500/80'}>{t.type === 'ENTRADA' ? '+' : '-'} {formatCurrency(t.amount)}</span>
                                                        </td>
                                                        <td className="px-4 py-3 text-center">
                                                            <div className="flex justify-center gap-1 opacity-0 group-hover:opacity-100">
                                                                <button onClick={() => { setEditingItem(t); setShowModal(true); }} className="p-0.5 text-slate-300 hover:text-blue-500"><Icon name="Pencil" size={12}/></button>
                                                                <button onClick={() => deleteItem(t.id, t.isRecurrent)} className="p-0.5 text-slate-300 hover:text-rose-500"><Icon name="Trash2" size={12}/></button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="px-4 py-3 bg-slate-50 border-t border-slate-100 flex items-center gap-4">
                                        <div className="text-[7px] font-bold text-slate-300 uppercase">Fluxo</div>
                                        <div className="flex-1 h-1 bg-slate-200 rounded-full overflow-hidden flex shadow-inner">
                                            <div className="bg-emerald-500 transition-all duration-1000" style={{ width: `${stats.totalIn + stats.totalOut === 0 ? 50 : (stats.totalIn / (stats.totalIn + stats.totalOut)) * 100}%` }} />
                                            <div className="bg-rose-500/60 transition-all duration-1000" style={{ width: `${stats.totalIn + stats.totalOut === 0 ? 50 : (stats.totalOut / (stats.totalIn + stats.totalOut)) * 100}%` }} />
                                        </div>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="max-w-2xl mx-auto space-y-4 animate-in fade-in">
                                <div className="bg-[#111827] rounded-2xl p-6 text-white shadow-lg relative overflow-hidden border border-slate-800">
                                    <h2 className="text-lg font-medium uppercase tracking-widest">Base Fixa</h2>
                                    <p className="text-slate-400 text-[9px] uppercase mt-1">Lançamentos que se repetem todo mês.</p>
                                    <Icon name="ListTodo" className="absolute right-[-10px] bottom-[-10px] text-white/5" size={80} />
                                </div>
                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                                    <div className="px-5 py-3 border-b flex justify-between items-center bg-slate-50/50">
                                        <span className="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Configuração</span>
                                        <button onClick={() => { setEditingItem(null); setShowModal(true); }} className="flex items-center gap-1.5 text-blue-600 font-bold text-[8px] border border-blue-100 px-3 py-1.5 rounded-lg bg-white shadow-sm hover:bg-blue-50 transition-all"><Icon name="PlusCircle" size={12}/> Novo Item Fixo</button>
                                    </div>
                                    <div className="divide-y divide-slate-50">
                                        {recurrentItems.length === 0 ? <div className="p-10 text-center text-slate-300 text-[10px] italic">Nada cadastrado.</div> : recurrentItems.map(r => (
                                            <div key={r.id} className="p-4 flex items-center justify-between hover:bg-slate-50 transition-colors group">
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${r.type === 'ENTRADA' ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-400'}`}><Icon name={r.type === 'ENTRADA' ? 'ArrowUp' : 'ArrowDown'} size={14}/></div>
                                                    <div><h4 className="text-[11px] font-medium text-slate-700 uppercase leading-none mb-1">{r.desc}</h4><p className="text-[8px] text-slate-400 uppercase tracking-tight">Vence Dia {r.dueDay || '01'} • {r.category}</p></div>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <span className={`text-[11px] font-medium ${r.type === 'ENTRADA' ? 'text-emerald-600' : 'text-slate-700'}`}>{formatCurrency(r.amount)}</span>
                                                    <div className="flex gap-1.5 opacity-0 group-hover:opacity-100">
                                                        <button onClick={() => { setEditingItem({...r, isRecurrent: true}); setShowModal(true); }} className="p-1 text-slate-300 hover:text-blue-500"><Icon name="Pencil" size={14}/></button>
                                                        <button onClick={() => deleteItem(r.id, true)} className="p-1 text-slate-300 hover:text-rose-500"><Icon name="Trash2" size={14}/></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL CONFIGURAÇÕES */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-[#111827]/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-xs rounded-[2rem] p-6 shadow-2xl border border-white/10 animate-in zoom-in-95">
                                <div className="flex justify-between items-center mb-6"><h2 className="text-xs font-bold text-slate-800 uppercase tracking-widest">Ajustes</h2><button onClick={() => setShowSettings(false)} className="text-slate-300 hover:text-slate-500"><Icon name="X" size={20}/></button></div>
                                <div className="space-y-4">
                                    <div className="space-y-1.5"><label className="text-[7px] uppercase text-slate-400 font-bold ml-1 tracking-widest">Título</label><input type="text" className="w-full bg-[#F8FAFC] border border-slate-200 rounded-xl p-3 text-[11px] outline-none focus:ring-1 focus:ring-blue-500" value={appTitle} onChange={(e) => setAppTitle(e.target.value)} /></div>
                                    <div className="space-y-1.5">
                                        <label className="text-[7px] uppercase text-slate-400 font-bold ml-1 tracking-widest">Logo</label>
                                        <div className="flex items-center gap-3 bg-[#F8FAFC] p-3 rounded-xl border border-slate-100 shadow-inner">
                                            <div className="w-10 h-10 rounded-lg bg-white flex items-center justify-center overflow-hidden border border-slate-200">{appLogo ? <img src={appLogo} className="w-full h-full object-cover" /> : <Icon name="ImageIcon" size={18} className="text-slate-300" />}</div>
                                            <label className="flex-1 cursor-pointer"><span className="bg-blue-600 text-white text-[8px] font-bold uppercase py-2 px-3 rounded-lg flex items-center justify-center gap-1.5 hover:bg-blue-700 active:scale-95 transition-all"><Icon name="Upload" size={12}/> Subir</span><input type="file" className="hidden" accept="image/*" onChange={(e) => { const f = e.target.files[0]; if(f){ const r = new FileReader(); r.onloadend = () => setAppLogo(r.result); r.readAsDataURL(f); } }} /></label>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowSettings(false)} className="w-full bg-[#111827] text-white py-3 rounded-xl font-bold text-[9px] uppercase tracking-widest shadow-xl mt-2 active:scale-95 transition-all">Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL REGISTRO */}
                    {showModal && (
                        <div className="fixed inset-0 bg-[#111827]/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-xs rounded-[2rem] p-6 shadow-2xl border border-white/10 animate-in zoom-in-95 font-medium">
                                <div className="flex justify-between items-center mb-6"><h2 className="text-xs font-bold text-slate-800 uppercase tracking-widest">{editingItem ? 'Editar' : 'Novo'}</h2><button onClick={closeModal} className="text-slate-300 hover:text-slate-500"><Icon name="X" size={20}/></button></div>
                                <form onSubmit={(e) => { e.preventDefault(); handleSave(editingItem ? editingItem : { desc: e.target.desc.value, amount: e.target.amount.value, type: e.target.type.value, category: e.target.category.value, date: e.target.date?.value, dueDay: e.target.dueDay?.value, isPaid: e.target.isPaid?.checked }); }} className="space-y-4">
                                    <div className="flex bg-[#F1F5F9] p-1 rounded-xl border border-slate-200">
                                        <button type="button" onClick={() => setEditingItem(p => ({...p, type: 'ENTRADA'}))} className={`flex-1 py-2 rounded-lg text-[8px] font-bold uppercase transition-all ${(editingItem?.type || 'SAIDA') === 'ENTRADA' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-400'}`}>Entrada</button>
                                        <button type="button" onClick={() => setEditingItem(p => ({...p, type: 'SAIDA'}))} className={`flex-1 py-2 rounded-lg text-[8px] font-bold uppercase transition-all ${(editingItem?.type || 'SAIDA') === 'SAIDA' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-400'}`}>Saída</button>
                                        <input type="hidden" name="type" value={editingItem?.type || 'SAIDA'} />
                                    </div>
                                    <div className="space-y-1"><label className="text-[7px] font-bold text-slate-400 uppercase ml-1">Item</label><input required name="desc" type="text" className="w-full bg-[#F8FAFC] border border-slate-200 rounded-lg p-3 text-[11px] outline-none" defaultValue={editingItem?.desc} /></div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="space-y-1"><label className="text-[7px] font-bold text-slate-400 uppercase ml-1">R$</label><input required name="amount" type="number" step="0.01" className="w-full bg-[#F8FAFC] border border-slate-200 rounded-lg p-3 text-[11px] outline-none" defaultValue={editingItem?.amount} /></div>
                                        <div className="space-y-1"><label className="text-[7px] font-bold text-slate-400 uppercase ml-1">Tag</label><select name="category" className="w-full bg-[#F8FAFC] border border-slate-200 rounded-lg p-3 text-[11px] outline-none appearance-none" defaultValue={editingItem?.category || 'Fixo'}><option>Fixo</option><option>Extra</option><option>Contas</option><option>Cartão</option><option>Outros</option></select></div>
                                    </div>
                                    {view === 'fixos' ? <div className="space-y-1"><label className="text-[7px] font-bold text-slate-400 uppercase ml-1">Dia Venc.</label><input required name="dueDay" type="number" min="1" max="31" className="w-full bg-[#F8FAFC] border border-slate-200 rounded-lg p-3 text-[11px]" defaultValue={editingItem?.dueDay || 5} /></div> : <div className="grid grid-cols-2 gap-3"><div className="space-y-1"><label className="text-[7px] font-bold text-slate-400 uppercase ml-1">Data</label><input name="date" type="date" className="w-full bg-[#F8FAFC] border border-slate-200 rounded-lg p-3 text-[9px]" defaultValue={editingItem?.date} /></div><div className="flex items-center justify-end pb-2.5"><label className="flex items-center gap-1.5 cursor-pointer"><input name="isPaid" type="checkbox" className="w-3.5 h-3.5 rounded-md text-blue-600 focus:ring-0" defaultChecked={editingItem?.isPaid} /><span className="text-[8px] font-bold text-slate-400 uppercase">Pago</span></label></div></div>}
                                    <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-[9px] uppercase tracking-widest shadow-xl active:scale-95 transition-all mt-2">Salvar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
